[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fresnel-agent"
version = "0.4.0"
description = "Mac-native orchestration harness for bounded local coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Fresnel contributors"}]
keywords = ["agents", "mlx", "coding", "orchestration", "mcp"]
classifiers = [
  "Environment :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
setup = ["huggingface-hub>=0.34,<2"]
test = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
fresnel = "fresnel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fresnel"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/fresnel" = "fresnel/_bundled_skill"

[tool.hatch.build.targets.sdist]
include = ["src/fresnel", "integrations", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "TRY004"]
